# Shared by both replicas. Secrets stay in the compose environment, not here.
cluster:
  enabled: true
  namespace: lab
  profile_id: default
  object_store:
    backend: s3
    endpoint: http://minio:9000
    bucket: hermes
    region: us-east-1
    addressing_style: path
  proxy:
    allow_hosts:
      - gateway-a
      - gateway-b
