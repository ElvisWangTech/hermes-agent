<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket 管理 · 交互评审稿</title>
<style>
:root{--ink:#20282b;--muted:#647174;--line:#dce3e4;--bg:#f3f6f6;--teal:#087d72;--red:#b33636;--amber:#92610d}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.6 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:6px;padding:9px 14px;color:inherit;min-height:44px}button:hover{background:#eef4f3}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.danger{color:var(--red);border-color:#dab9b9}button.solid-danger{background:var(--red);color:white;border-color:var(--red)}button.icon{width:44px;padding:10px;display:inline-flex;align-items:center;justify-content:center}svg{width:18px;height:18px;flex-shrink:0}button svg{vertical-align:middle}input,select{border:1px solid #c9d3d5;background:white;border-radius:6px;min-height:44px;padding:9px 12px;max-width:100%}input{min-width:0}input:focus,button:focus-visible,select:focus{outline:3px solid #7abeb7;outline-offset:2px}h1,h2,h3,p{margin:0}h1{font-size:24px}h2{font-size:20px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.review{background:#e9efef;border-bottom:1px solid var(--line);padding:9px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.review select{font-size:12px;min-height:32px;padding:3px 8px}.shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:calc(100vh - 52px)}aside{padding:25px 16px;background:#fff;border-right:1px solid var(--line)}.brand{font-size:20px;font-weight:600;padding:0 12px 28px}nav{display:grid;gap:6px}nav button{text-align:left;border:0;display:flex;gap:12px;align-items:center;background:transparent}nav button.active{background:#e5f2ef;color:var(--teal);font-weight:600}.aside-foot{padding:30px 12px;color:var(--muted);font-size:12px}.workspace{min-width:0}header{height:66px;background:white;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between}.menu{display:none!important}main{max-width:1260px;padding:30px 32px 70px;margin:auto}.heading,.toolbar,.row,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.heading{justify-content:space-between;margin-bottom:22px}.toolbar{margin-bottom:20px}.toolbar input{flex:1;max-width:400px}.surface{background:white;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:13px}th{font-weight:500;color:var(--muted);text-align:left;background:#f8fafa}td,th{padding:15px 16px;border-bottom:1px solid #e8eded}tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;object-fit:cover;object-position:top;border-radius:6px;background:#e9efef}.avatar.large{width:72px;height:72px}.badge{display:inline-block;padding:2px 8px;background:#e5f3ee;color:#16665b;font-size:12px;border-radius:4px;white-space:nowrap}.badge.pending{background:#fff3d8;color:var(--amber)}.badge.off{background:#edf0f1;color:#627174}.badge.bad{background:#fae8e7;color:var(--red)}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:26px 0 0}.tabs button{border:0;background:transparent;border-radius:0;padding:12px 0;color:var(--muted)}.tabs button.active{border-bottom:2px solid var(--teal);color:var(--teal)}.section{padding:24px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.facts dt{font-size:12px;color:var(--muted)}.facts dd{margin:4px 0 0}.notice{padding:13px 16px;background:#edf4f3;border-left:3px solid #559d94;margin:16px 0;font-size:13px}.notice.warn{background:#fff7e6;border-color:#b69242}.danger-zone{padding:24px 0;margin-top:12px}.danger-zone h3{color:var(--red)}.danger-zone p{margin:8px 0 16px}.empty{padding:60px 20px;text-align:center}.empty h2{margin-bottom:10px}.empty button{margin-top:18px}.mobile-list{display:none}.device-mobile{display:none}dialog{width:560px;max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:8px;padding:0;color:var(--ink);box-shadow:0 18px 70px #152b3033}dialog::backdrop{background:#10252766}.dialog-head{padding:22px 24px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.dialog-body{padding:0 24px 24px;max-height:65vh;overflow:auto}.dialog-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.field{display:grid;gap:6px;margin-top:18px}.target{display:flex;gap:12px;padding:14px 0;align-items:center}.code{font-size:26px;letter-spacing:0;line-height:1.5;padding:16px;background:#f1f6f5;word-break:break-all}.qr{margin:20px auto 8px;display:block;width:160px;height:160px;border:8px solid white;outline:1px solid var(--line)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);background:#243b3a;color:white;padding:12px 20px;border-radius:6px;z-index:10}.toast:empty{display:none}.steps{display:grid;gap:14px}.step{display:flex;align-items:center;gap:10px}.dot{width:8px;height:8px;background:var(--teal);border-radius:50%}.back{border:0;background:transparent;padding-left:0;margin-bottom:18px;color:var(--muted)}.record{display:grid;grid-template-columns:150px 1fr 110px;padding:16px 0;border-bottom:1px solid var(--line);gap:16px}.status-row{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}.no-wrap{white-space:nowrap}.review-label{padding:12px 0;color:var(--muted);font-size:12px}
@media(max-width:760px){.review{padding:8px 14px;align-items:flex-start;flex-wrap:wrap}.shell{display:block}aside{display:none;border-right:0;border-bottom:1px solid var(--line);padding:12px}aside.open{display:block}.brand,.aside-foot{display:none}nav{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:0 16px;height:60px}.menu{display:inline-flex!important}main{padding:24px 16px 48px}h1{font-size:22px}.heading{align-items:flex-start}.toolbar input{max-width:none;flex-basis:100%}.desktop-table{display:none}.mobile-list,.device-mobile{display:block}.mobile-item{padding:16px 0;border-bottom:1px solid var(--line)}.mobile-item .row{justify-content:space-between}.mobile-item .actions{margin-top:12px;justify-content:space-between}.facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tabs{gap:20px}.record{grid-template-columns:1fr;gap:4px}.dialog-head{padding:18px 16px}.dialog-body{padding:0 16px 20px}.dialog-foot{padding:14px 16px}.code{font-size:22px}.section-head{flex-wrap:wrap}.person{min-width:0}.person>div{min-width:0}.mono{font-size:12px}.review-label{line-height:1.6}}
</style>
</head>
<body>
<div class="review"><span><strong>交互评审稿</strong> · 全部为模拟数据，操作不会修改真实角色</span><label>场景 <select id="scenario"><option value="normal">正常</option><option value="loading">加载中</option><option value="error">服务不可达</option><option value="empty">无角色</option><option value="expired">连接码已过期</option></select></label></div>
<div class="shell"><aside id="sidebar"><div class="brand">Pocket 管理</div><nav id="nav"></nav><div class="aside-foot">单机部署<br>授权范围 · Pocket 专属角色</div></aside><div class="workspace"><header><div class="row"><button class="icon menu" id="menu" aria-label="打开导航" title="打开导航"></button><span>Pocket / <span id="breadcrumb">角色</span></span></div><span class="small muted">管理员 · 本机</span></header><main id="main"></main></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div class="toast" role="status" id="toast"></div>
<script>
const icons={users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',refresh:'<path d="M3 11a9 9 0 0 1 15.36-6.36L21 7M21 3v4h-4M21 13a9 9 0 0 1-15.36 6.36L3 17M7 17H3v4"/>',close:'<path d="m18 6-12 12M6 6l12 12"/>',back:'<path d="m12 19-7-7 7-7M5 12h14"/>'};
const icon=name=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[name]+'</svg>';
const roles=[{id:'p_83a1d7c0',name:'小禾',owner:'林先生',image:'young-0',state:'已激活',active:true,enabled:true},{id:'p_b419e265',name:'阿远',owner:'陈女士',image:'adult-1',state:'已激活',active:true,enabled:true},{id:'p_62df18a4',name:'未起名',owner:'未认主',image:'teen-0',state:'待激活',active:false,enabled:true}];
const devices={p_83a1d7c0:[{id:'d_92ac314f',label:'手机浏览器',note:'用户填写的备注',seen:'今天 14:32',connections:1,revoked:false},{id:'d_03bfa892',label:'平板浏览器',note:'用户填写的备注',seen:'今天 09:16',connections:0,revoked:false}],p_b419e265:[{id:'d_814af982',label:'常用设备',note:'用户填写的备注',seen:'昨天 18:24',connections:null,revoked:false}],p_62df18a4:[]};
const codes=[];const audit=[];let page='roles',selected=null,tab='access',scenario='normal',query='',filter='all',visibleCode=null,expiresAt=0,timer,toastTimer;
const labels={roles:'角色',codes:'连接码',audit:'操作记录',status:'服务状态'};
const escapeText=value=>String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const portrait=role=>'<img class="avatar" alt="'+role.name+'画像" src="../../apps/pocket/public/characters/'+role.image+'.png">';
const badge=(text,kind='')=>'<span class="badge '+kind+'">'+text+'</span>';
const blocked=()=>scenario==='error'||scenario==='loading';
const disabled=()=>blocked()?' disabled':'';
const liveDevices=role=>devices[role.id].filter(device=>!device.revoked);
function notify(text){clearTimeout(toastTimer);document.getElementById('toast').textContent=text;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3500)}
function renderNav(){document.getElementById('nav').innerHTML=Object.keys(labels).map((name,index)=>'<button data-page="'+name+'" class="'+(page===name?'active':'')+'">'+icon(['users','key','clock','activity'][index])+labels[name]+'</button>').join('');document.getElementById('breadcrumb').textContent=selected?selected.name:labels[page]}
function roleList(){const list=roles.filter(role=>(role.name+role.owner+role.id).includes(query)&&(filter==='all'||(filter==='active'?role.active:!role.active)));return '<div class="heading"><div><h1>角色</h1><p class="muted small">'+list.length+' 个角色 · '+roles.filter(role=>!role.active).length+' 个待激活</p></div><button disabled title="创建流程在首版 Figma 中评审">创建角色</button></div><div class="toolbar"><input id="search" aria-label="搜索角色" placeholder="搜索名字、主人称呼或稳定 ID" value="'+escapeText(query)+'"><select id="filter" aria-label="生命周期"><option value="all">全部生命周期</option><option value="active" '+(filter==='active'?'selected':'')+'>已激活</option><option value="pending" '+(filter==='pending'?'selected':'')+'>待激活</option></select><button class="icon" data-action="refresh" aria-label="刷新" title="刷新">'+icon('refresh')+'</button></div>'+(list.length?'<div class="surface desktop-table"><table><thead><tr><th>角色 / 稳定 ID</th><th>主人</th><th>生命周期</th><th>访问授权</th><th>有效凭证</th><th></th></tr></thead><tbody>'+list.map(role=>'<tr><td><div class="person">'+portrait(role)+'<div><strong>'+role.name+'</strong><div class="mono muted small">'+role.id+'</div></div></div></td><td>'+role.owner+'</td><td>'+badge(role.state,role.active?'':'pending')+'</td><td>'+badge(role.enabled?'开放':'已停用',role.enabled?'':'bad')+'</td><td>'+liveDevices(role).length+'</td><td><button data-role="'+role.id+'">查看</button></td></tr>').join('')+'</tbody></table></div><div class="mobile-list">'+list.map(role=>'<div class="mobile-item"><div class="row"><div class="person">'+portrait(role)+'<div><strong>'+role.name+'</strong><div class="mono muted">'+role.id+'</div></div></div>'+badge(role.state,role.active?'':'pending')+'</div><div class="actions"><span class="muted small">'+role.owner+' · '+liveDevices(role).length+' 个凭证 · '+(role.enabled?'授权开放':'授权停用')+'</span><button data-role="'+role.id+'">查看</button></div></div>').join('')+'</div>':'<div class="empty">没有匹配的角色</div>')}
function deviceRows(){const list=devices[selected.id];return list.length?'<div class="surface desktop-table"><table><thead><tr><th>设备备注 / 凭证 ID</th><th>最近使用</th><th>连接数</th><th>凭证状态</th><th></th></tr></thead><tbody>'+list.map(device=>'<tr><td><strong>'+device.label+'</strong><div class="mono muted small">'+device.id+'</div></td><td>'+device.seen+'</td><td>'+(device.connections===null?'未知':device.connections)+'</td><td>'+badge(device.revoked?'已撤销':'有效',device.revoked?'off':'')+'</td><td><button data-device="'+device.id+'">详情</button></td></tr>').join('')+'</tbody></table></div><div class="device-mobile">'+list.map(device=>'<div class="mobile-item"><div class="row"><strong>'+device.label+'</strong>'+badge(device.revoked?'已撤销':'有效',device.revoked?'off':'')+'</div><div class="mono muted">'+device.id+'</div><div class="actions"><span class="small muted">'+device.seen+' · '+(device.connections===null?'连接数未知':device.connections+' 个连接')+'</span><button data-device="'+device.id+'">详情</button></div></div>').join('')+'</div>':'<p class="muted">尚未签发设备凭证</p>'}
function details(){return '<button class="back" data-action="back">'+icon('back')+' 返回角色</button><div class="heading"><div class="person">'+portrait(selected)+'<div><h1>'+selected.name+'</h1><div class="mono muted">'+selected.id+'</div></div></div><div class="row">'+badge(selected.state,selected.active?'':'pending')+badge(selected.enabled?'访问开放':'访问已停用',selected.enabled?'':'bad')+'</div></div><div class="tabs">'+[['overview','概况'],['access','连接与凭证'],['history','管理记录']].map(([name,label])=>'<button data-tab="'+name+'" class="'+(tab===name?'active':'')+'">'+label+'</button>').join('')+'</div>'+(tab==='overview'?'<section class="section"><h3>主人绑定</h3><dl class="facts"><div><dt>主人称呼</dt><dd>'+selected.owner+'</dd></div><div><dt>验证方式</dt><dd>'+(selected.active?'授权绑定，未做声纹验证':'尚未绑定')+'</dd></div><div><dt>当前回合</dt><dd>未知</dd></div></dl></section><section class="section"><h3>激活进度</h3><div class="steps">'+['连接码兑换','形象与名字确认','主人确认','记忆提交','激活完成'].map(label=>'<div class="step"><span class="dot" style="background:'+(selected.active?'var(--teal)':'#aab4b6')+'"></span>'+label+'<span class="muted small">'+(selected.active?'已完成':'待完成')+'</span></div>').join('')+'</div></section>':tab==='history'?records(selected.id):'<section class="section"><div class="section-head"><h3>连接码</h3><button class="primary" data-action="issue" '+(!selected.enabled?'disabled':disabled())+'>签发连接码</button></div><p class="muted small">'+(selected.active?'重新连接沿用既有主人和角色，不重新起名认主。':'首次激活继续此角色的引导进度。')+'</p>'+codeList(selected.id)+'</section><section class="section"><div class="section-head"><h3>设备凭证 <span class="muted small">'+liveDevices(selected).length+' 个有效</span></h3></div><p class="muted small" style="margin-bottom:16px">设备备注不是经过验证的硬件身份；离线不等于凭证失效。</p>'+deviceRows()+'</section><section class="danger-zone"><h3>停用角色访问</h3><p class="muted">撤销全部设备与未兑换连接码。保留角色、主人、记忆和历史对话。</p><button class="danger" data-action="disable" '+(!selected.enabled?'disabled':disabled())+'>停用全部授权</button></section>')}
function codeStatus(code){if(code.state==='有效'&&(scenario==='expired'||Date.now()>code.until))return '已过期';return code.state}
function codeList(roleId){const list=codes.filter(code=>!roleId||code.role===roleId);return list.length?list.map(code=>'<div class="record"><div class="mono">'+code.id+'<div class="small muted">'+code.role+'</div></div><div>'+code.purpose+'<div class="small muted">到期 '+new Date(code.until).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'</div></div><div>'+badge(codeStatus(code),codeStatus(code)==='有效'?'':'off')+(codeStatus(code)==='有效'?'<button class="danger" style="margin-top:8px" data-code="'+code.id+'" '+disabled()+'>撤销</button>':'')+'</div></div>').join(''):'<p class="muted" style="padding:20px 0">暂无连接码记录</p>'}
function records(roleId){const list=audit.filter(record=>!roleId||record.role===roleId);return list.length?list.slice().reverse().map(record=>'<div class="record"><span class="muted small">'+record.time+'</span><div>'+record.text+'<div class="mono muted small">'+record.role+'</div></div>'+badge('模拟成功')+'</div>').join(''):'<div class="empty muted">暂无本次预览的操作记录</div>'}
function render(){renderNav();let body;if(scenario==='loading')body='<div class="empty" role="status"><h2>正在加载</h2><p class="muted">等待角色与授权状态</p></div>';else if(scenario==='error')body='<div class="empty" role="alert"><h2>服务不可达</h2><p class="muted">授权状态无法核实，变更操作已停用。</p><button data-action="retry">重试</button></div>';else if(scenario==='empty'&&page==='roles')body='<div class="heading"><h1>角色</h1></div><div class="empty"><h2>尚无 Pocket 角色</h2><p class="muted">只管理显式登记的 Pocket 专属 profile</p><button disabled>创建角色</button></div>';else if(selected)body=details();else if(page==='roles')body=roleList();else if(page==='codes')body='<div class="heading"><h1>连接码</h1><span class="muted small">只展示元数据，不保存明文</span></div>'+codeList();else if(page==='audit')body='<div class="heading"><h1>操作记录</h1></div>'+records();else body='<div class="heading"><h1>服务状态</h1>'+badge('模拟部署','off')+'</div>'+[['HTTPS 入口','未验证'],['后端连接','未验证'],['Profile 存储','未验证'],['听写 / 朗读','未验证'],['声纹识别','第二阶段，未启用']].map(([label,state])=>'<div class="status-row"><strong>'+label+'</strong>'+badge(state,'off')+'</div>').join('');document.getElementById('main').innerHTML=body}
function log(text){audit.push({role:selected.id,text,time:new Date().toLocaleString('zh-CN')})}
function closeDialog(){clearInterval(timer);visibleCode=null;document.getElementById('dialog').close();document.getElementById('dialog').innerHTML='';render()}
function modal(title,body,footer){const dialog=document.getElementById('dialog');dialog.innerHTML='<div class="dialog-head"><h2 id="dialog-title">'+title+'</h2><button class="icon" data-modal="close" title="关闭" aria-label="关闭">'+icon('close')+'</button></div><div class="dialog-body">'+body+'</div><div class="dialog-foot">'+footer+'</div>';if(!dialog.open)dialog.showModal()}
const target=()=>'<div class="target">'+portrait(selected)+'<div><strong>'+selected.name+'</strong><div class="mono muted">'+selected.id+'</div></div></div>';
function issue(){modal('签发连接码',target()+'<label class="field">用途<select id="purpose"><option>'+(selected.active?'重新连接':'首次激活')+'</option><option>恢复激活进度</option></select></label><label class="field">有效期<select id="ttl"><option value="5">5 分钟</option><option value="10" selected>10 分钟</option><option value="30">30 分钟</option></select></label><div class="notice warn">拿到连接码的人可以取得此角色访问权。签发前请核实申请；同用途旧码将失效。</div>','<button data-modal="close">取消</button><button class="primary" data-modal="issue-confirm">确认签发</button>')}
function showCode(){const purpose=document.getElementById('purpose').value;const minutes=Number(document.getElementById('ttl').value);codes.filter(code=>code.role===selected.id&&code.purpose===purpose&&code.state==='有效').forEach(code=>code.state='已撤销');visibleCode='DEMO-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();expiresAt=Date.now()+minutes*60000;codes.push({id:'c_'+String(codes.length+1).padStart(4,'0'),role:selected.id,purpose,until:expiresAt,state:'有效'});log('签发'+purpose+'码');modal('连接码已签发',target()+'<div class="notice warn">明文只在本次展示。关闭后无法再次查看，遗失请重新签发。</div><div class="code mono" id="secret">'+visibleCode+'</div><div class="row" style="justify-content:space-between;margin-top:12px"><span class="muted small" id="expiry"></span><button class="icon" data-modal="copy" title="复制模拟连接码" aria-label="复制模拟连接码">'+icon('copy')+'</button></div><canvas class="qr" id="qr" width="144" height="144" aria-label="二维码视觉占位，不可用于兑换"></canvas><p class="small muted" style="text-align:center">二维码视觉占位 · 无真实兑换材料</p><p class="review-label">评审状态：二维码接入须使用可信 HTTPS 和短时兑换材料，不嵌入长期凭证。</p>','<button data-modal="expire">模拟过期</button><button class="primary" data-modal="close">已交付，关闭</button>');const canvas=document.getElementById('qr'),context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,144,144);context.fillStyle='#748986';for(let row=0;row<24;row++)for(let column=0;column<24;column++)if((row*17+column*11)%7<3)context.fillRect(column*6,row*6,5,5);function tick(){const seconds=Math.max(0,Math.floor((expiresAt-Date.now())/1000));document.getElementById('expiry').textContent=seconds?'剩余 '+Math.floor(seconds/60)+' 分 '+seconds%60+' 秒':'已过期，请关闭后重新签发';if(!seconds){visibleCode=null;document.getElementById('secret').textContent='连接码已过期';document.querySelector('[data-modal="copy"]').disabled=true;context.clearRect(0,0,144,144);clearInterval(timer)}}tick();timer=setInterval(tick,1000)}
function deviceDetail(device){modal('设备授权详情',target()+'<dl class="facts"><div><dt>设备备注</dt><dd>'+device.label+'</dd></div><div><dt>凭证状态</dt><dd>'+badge(device.revoked?'已撤销':'有效',device.revoked?'off':'')+'</dd></div><div><dt>当前连接</dt><dd>'+(device.connections===null?'未知':device.connections)+'</dd></div><div><dt>最近使用</dt><dd>'+device.seen+'</dd></div></dl><p class="mono muted" style="margin-top:16px">'+device.id+'</p><div class="notice">备注由用户填写，不证明硬件身份。此处不显示访问凭证明文。</div>','<button data-modal="close">关闭</button><button class="danger" data-modal="revoke" data-id="'+device.id+'" '+(device.revoked?'disabled':disabled())+'>撤销此设备</button>')}
function confirmRevoke(device){modal('撤销此设备？',target()+'<p><strong>'+device.label+'</strong></p><p class="mono muted">'+device.id+'</p><div class="notice warn">仅此凭证失效。角色记忆、主人、历史对话及其他设备不受影响。</div><p class="muted small">目标行为：拒绝后续请求、断开对应连接并取消此凭证发起的未完成回合。</p><p class="review-label">当前实现尚未完成主动断连与在途回合取消；本稿仅模拟最终状态。</p>','<button data-modal="close">取消</button><button class="solid-danger" data-modal="revoke-confirm" data-id="'+device.id+'">确认撤销</button>')}
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.page){closeDialog();page=button.dataset.page;selected=null;document.getElementById('sidebar').classList.remove('open');render()}if(button.dataset.role){selected=roles.find(role=>role.id===button.dataset.role);tab='access';render()}if(button.dataset.tab){tab=button.dataset.tab;render()}if(button.dataset.device)deviceDetail(devices[selected.id].find(device=>device.id===button.dataset.device));if(button.dataset.code){const code=codes.find(entry=>entry.id===button.dataset.code);modal('撤销连接码？','<p class="mono">'+code.id+' / '+code.role+'</p><div class="notice warn">未兑换连接码将失效，已授权设备不受影响。</div>','<button data-modal="close">取消</button><button class="solid-danger" data-modal="code-revoke" data-id="'+code.id+'">确认撤销</button>')}const action=button.dataset.action;if(action==='back'){selected=null;render()}if(action==='refresh')notify('模拟数据已刷新');if(action==='retry'){scenario='normal';document.getElementById('scenario').value='normal';render()}if(action==='issue')issue();if(action==='disable')modal('停用全部授权？',target()+'<div class="notice warn">全部设备凭证和未兑换连接码将失效。此操作不是角色销毁，不删除主人、记忆或历史对话。</div><label class="field">输入目标稳定 ID<input id="confirm-id" autocomplete="off" placeholder="'+selected.id+'"></label><p class="review-label">输入 ID 仅防误点，不代表管理员身份验证。重新开放访问需另行评审。</p>','<button data-modal="close">取消</button><button class="solid-danger" id="disable-confirm" data-modal="disable-confirm" disabled>停用全部授权</button>');const command=button.dataset.modal;if(command==='close')closeDialog();if(command==='issue-confirm')showCode();if(command==='expire'){expiresAt=0;codes[codes.length-1].until=0}if(command==='copy'&&visibleCode){try{await navigator.clipboard.writeText(visibleCode);notify('模拟连接码已复制')}catch{notify('浏览器不允许复制，请选择连接码文本')}}if(command==='revoke')confirmRevoke(devices[selected.id].find(device=>device.id===button.dataset.id));if(command==='revoke-confirm'){const device=devices[selected.id].find(entry=>entry.id===button.dataset.id);device.revoked=true;device.connections=0;log('撤销设备 '+device.id);closeDialog();notify('模拟：已撤销此设备，其他设备保持有效')}if(command==='disable-confirm'){selected.enabled=false;devices[selected.id].forEach(device=>{device.revoked=true;device.connections=0});codes.filter(code=>code.role===selected.id&&code.state==='有效').forEach(code=>code.state='已撤销');log('停用全部授权');closeDialog();notify('模拟：访问已停用，角色数据保留')}if(command==='code-revoke'){const code=codes.find(entry=>entry.id===button.dataset.id);code.state='已撤销';audit.push({role:code.role,text:'撤销连接码 '+code.id,time:new Date().toLocaleString('zh-CN')});closeDialog();notify('模拟：连接码已撤销')}});
document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;const cursor=event.target.selectionStart;render();const search=document.getElementById('search');search.focus();search.setSelectionRange(cursor,cursor)}if(event.target.id==='confirm-id')document.getElementById('disable-confirm').disabled=event.target.value!==selected.id});
document.addEventListener('change',event=>{if(event.target.id==='filter'){filter=event.target.value;render()}if(event.target.id==='scenario'){closeDialog();scenario=event.target.value;render()}});
document.getElementById('dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog()});document.getElementById('menu').innerHTML=icon('menu');document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');render();
</script>
</body>
</html>
